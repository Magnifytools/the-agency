name: Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agency
          POSTGRES_PASSWORD: agency_test_only
          POSTGRES_DB: the_agency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agency -d the_agency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://agency:agency_test_only@localhost:5432/the_agency_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Run backend tests
        run: pytest backend/tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run frontend tests
        run: npx vitest run --reporter=verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend (errors only)
        run: ruff check backend/ --select E9,F63,F7,F82 --no-fix

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend npm audit
        run: cd frontend && npm ci && npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend pip audit
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install --upgrade pip==26.2.1
          .venv-audit/bin/python -m pip install -r backend/requirements.txt pip-audit==2.10.1
          .venv-audit/bin/python -m pip check
          .venv-audit/bin/python -m pip_audit

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without publishing
        run: docker build --tag agency-ci .

  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: chrome-extension/package-lock.json
      - name: Verify extension behavior and dependencies
        run: |
          npm --prefix chrome-extension ci
          npm --prefix chrome-extension test
          npm --prefix chrome-extension audit --audit-level=high
